<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>آهنگ‌های دوستان</title><style>*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;background:#101827;color:#eef2ff;margin:0}main{max-width:950px;margin:auto;padding:22px}h1{margin-bottom:5px}p,small{color:#aebbd0}.panel{background:#1d293b;border:1px solid #34445b;border-radius:15px;padding:17px;margin:15px 0}input,button,select{font:inherit;border-radius:9px;padding:11px;margin:5px 0}input,select{background:#101827;border:1px solid #4b5d74;color:white;width:100%}button{background:#67e8c4;color:#092a29;border:0;cursor:pointer;font-weight:bold}button.secondary{background:#34445b;color:white}button.danger{background:#7c3045;color:white}button:disabled{opacity:.5}label{display:block;margin-top:8px} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.song{background:#23334a;padding:15px;border-radius:12px;overflow-wrap:anywhere}.song h3{margin:0 0 8px}.song a{color:#86e5ff}.hidden{display:none}.msg{min-height:22px;color:#a6f3d5}#userInfo{color:#bfeada}a{color:#a8d9ff}</style></head><body><main><h1>🎵 آهنگ‌های دوستان</h1><p>آرشیو مشترک آهنگ‌ها؛ جستجو، دسته‌بندی و معرفی موسیقی</p><section class="panel" id="setup"><h2>راه‌اندازی اولیه</h2><p>نشانی پروژه Supabase و کلید Publishable/anon را وارد کنید. این تنظیم فقط در همین مرورگر ذخیره می‌شود. کلید service_role را هرگز وارد نکنید.</p><label>Project URL<input id="url" placeholder="https://xxxx.supabase.co"></label><label>Publishable / anon key<input id="key" placeholder="sb_publishable_... یا eyJ..."></label><button id="saveConfig">اتصال</button></section><section class="panel hidden" id="auth"><h2>ورود / ثبت‌نام</h2><div id="userInfo"></div><div id="authFields"><label>ایمیل<input type="email" id="email" autocomplete="email"></label><label>رمز عبور<input type="password" id="password" autocomplete="current-password" minlength="6"></label><button id="signIn">ورود</button> <button class="secondary" id="signUp">ثبت‌نام</button></div><button id="signOut" class="secondary hidden">خروج</button> <button id="resetConfig" class="secondary">تغییر اتصال</button><div class="msg" id="authMsg" role="status"></div></section><section class="panel hidden" id="add"><h2>افزودن آهنگ</h2><form id="songForm"><div class="grid"><label>نام آهنگ<input id="title" required maxlength="150"></label><label>نام خواننده<input id="artist" required maxlength="120"></label><label>لینک آهنگ (HTTPS)<input id="link" type="url" required placeholder="https://..."></label><label>نام معرفی‌کننده (اختیاری)<input id="sharedBy" maxlength="80"></label></div><button type="submit">ثبت آهنگ</button></form></section><section class="panel hidden" id="library"><h2>کتابخانه موسیقی</h2><div class="grid"><label>جستجو<input id="search" placeholder="آهنگ یا خواننده"></label><label>خواننده<select id="artistFilter"><option value="">همه خوانندگان</option></select></label></div><button class="secondary" id="refresh">به‌روزرسانی</button><div id="songs" class="grid"></div></section><div class="msg" id="status" role="status"></div></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const $=id=>document.getElementById(id);let db=null,user=null,songs=[];const show=(id,on)=>$(id).classList.toggle('hidden',!on);const message=(id,s)=>$(id).textContent=s;const cleanUrl=s=>{try{let u=new URL(s);return u.protocol==='https:'?u.href:null}catch{return null}};
function init(){let url=localStorage.getItem('music_url'),key=localStorage.getItem('music_key');if(!url||!key)return;try{db=createClient(url,key);show('setup',false);show('auth',true);db.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;renderAuth();if(user)loadSongs()});db.auth.getSession().then(({data})=>{user=data.session?.user||null;renderAuth();if(user)loadSongs()})}catch(e){message('status','اتصال نامعتبر: '+e.message)}}
function renderAuth(){show('authFields',!user);show('signOut',!!user);show('add',!!user);show('library',!!user);$('userInfo').textContent=user?'وارد شده با: '+user.email:'';if(!user){songs=[];$('songs').replaceChildren()}}
$('saveConfig').onclick=()=>{let url=$('url').value.trim().replace(/\/$/,''),key=$('key').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)||!key){message('status','نشانی Supabase یا کلید معتبر نیست.');return}localStorage.setItem('music_url',url);localStorage.setItem('music_key',key);init()};
$('resetConfig').onclick=()=>{localStorage.removeItem('music_url');localStorage.removeItem('music_key');location.reload()};
$('signUp').onclick=async()=>{let {error}=await db.auth.signUp({email:$('email').value.trim(),password:$('password').value});message('authMsg',error?error.message:'ثبت‌نام انجام شد؛ در صورت فعال بودن تأیید ایمیل، صندوق ایمیل خود را بررسی کنید.')};
$('signIn').onclick=async()=>{let {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});message('authMsg',error?error.message:'ورود موفق')};
$('signOut').onclick=async()=>{await db.auth.signOut();message('authMsg','خارج شدید')};
$('songForm').onsubmit=async e=>{e.preventDefault();let link=cleanUrl($('link').value.trim());if(!link){message('status','لینک باید با https شروع شود.');return}let {error}=await db.from('songs').insert({title:$('title').value.trim(),artist:$('artist').value.trim(),url:link,shared_by:$('sharedBy').value.trim()||null});if(error){message('status',error.message);return}e.target.reset();message('status','آهنگ ثبت شد');await loadSongs()};
async function loadSongs(){let {data,error}=await db.from('songs').select('id,title,artist,url,shared_by,user_id,created_at').order('created_at',{ascending:false}).limit(1000);if(error){message('status','خطا در خواندن آهنگ‌ها: '+error.message);return}songs=data||[];let previous=$('artistFilter').value;let artists=[...new Set(songs.map(s=>s.artist))].sort((a,b)=>a.localeCompare(b,'fa'));$('artistFilter').replaceChildren(new Option('همه خوانندگان',''),...artists.map(a=>new Option(a,a)));$('artistFilter').value=artists.includes(previous)?previous:'';renderSongs();message('status',songs.length+' آهنگ دریافت شد')}
function renderSongs(){let q=$('search').value.trim().toLocaleLowerCase(),a=$('artistFilter').value;let filtered=songs.filter(s=>(!a||s.artist===a)&&(!q||(s.title+' '+s.artist).toLocaleLowerCase().includes(q)));$('songs').replaceChildren();if(!filtered.length){$('songs').textContent='آهنگی پیدا نشد.';return}for(let s of filtered){let card=document.createElement('article');card.className='song';let h=document.createElement('h3');h.textContent=s.title;let artist=document.createElement('div');artist.textContent='🎤 '+s.artist;let by=document.createElement('small');by.textContent=s.shared_by?'معرفی: '+s.shared_by:'';let link=document.createElement('a');link.href=s.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='🔗 باز کردن آهنگ';card.append(h,artist,by,document.createElement('br'),link);if(s.user_id===user?.id){let del=document.createElement('button');del.className='danger';del.textContent='حذف';del.onclick=async()=>{if(!confirm('این آهنگ حذف شود؟'))return;let {error}=await db.from('songs').delete().eq('id',s.id);if(error)message('status',error.message);else loadSongs()};card.append(document.createElement('br'),del)}$('songs').append(card)}}
$('search').oninput=renderSongs;$('artistFilter').onchange=renderSongs;$('refresh').onclick=loadSongs;init();
</script></body></html>
