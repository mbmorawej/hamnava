<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>افزودن آهنگ | HamNava</title><style>
:root{color-scheme:dark;font-family:Tahoma,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#101010;color:#f6f6f6}header{display:flex;justify-content:space-between;align-items:center;padding:24px max(24px,calc((100vw - 940px)/2));background:#080808;border-bottom:1px solid #292929}a{color:#1ed760;text-decoration:none}.logo{font-size:24px;font-weight:900}.logo span{color:#1ed760}main{max-width:940px;margin:38px auto;padding:0 22px}.panel{background:#1c1c1c;border:1px solid #303030;border-radius:18px;padding:clamp(22px,4vw,44px)}h1{font-size:clamp(28px,4vw,42px);margin:0 0 10px}p{color:#bbb;line-height:1.9}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}label{display:block;font-size:14px;color:#e6e6e6}input{display:block;margin-top:9px;width:100%;background:#101010;color:#fff;border:1px solid #444;border-radius:9px;padding:15px;font:inherit;direction:rtl}input:focus{outline:2px solid #1ed760;border-color:transparent}button{border:0;background:#1ed760;color:#06140a;border-radius:999px;padding:15px 30px;font:inherit;font-weight:900;cursor:pointer;margin-top:24px}button:disabled{opacity:.6;cursor:wait}.status{min-height:25px}.hidden{display:none}.back{display:inline-block;margin-bottom:20px}@media(max-width:650px){.grid{grid-template-columns:1fr}header{padding:20px}}
</style><style id="hamnava-language-style">#languageControl{position:fixed;right:18px;top:14px;z-index:9999;display:flex;align-items:center;gap:8px;background:#22272c;color:#fff;border:1px solid #3e444c;border-radius:14px;padding:8px 12px;box-shadow:0 5px 24px #0008;font:13px Arial,sans-serif}#languageControl select{color:white;background:#11181c;border:1px solid #4b5659;border-radius:9px;padding:7px;max-width:145px}#languageControl label{white-space:nowrap}body{padding-top:48px}body.ltr{text-align:left}body.ltr .sidebar{direction:ltr}body.ltr .side-link.active{border-right:0;border-left:3px solid #1ed760}body.ltr input,body.ltr select{direction:ltr}body.ltr .panel,body.ltr .hero,body.ltr .add-tile{direction:ltr}body.ltr header{direction:ltr}body.ltr .grid{direction:ltr}@media(max-width:650px){#languageControl{top:6px;right:6px;padding:5px;font-size:11px}#languageControl label{display:none}#languageControl select{max-width:125px}body{padding-top:42px}}</style></head><body><header><div class="logo"><span>♫</span> HamNava</div><a href="index.html">بازگشت به کتابخانه ←</a></header><main><a class="back" href="index.html">← صفحه اصلی</a><section class="panel"><h1>افزودن آهنگ جدید</h1><p>آهنگ موردعلاقه‌ات را با دوستانت به اشتراک بگذار. پس از ثبت به کتابخانه برمی‌گردی.</p><p id="authHint"></p><form id="songForm" class="hidden"><div class="grid"><label>نام آهنگ *<input name="title" maxlength="150" required></label><label>نام خواننده *<input name="artist" maxlength="120" required></label><label>لینک آهنگ (HTTPS)<input name="url" type="url" placeholder="https://..."></label><label>نام معرفی‌کننده<input name="shared_by" maxlength="80"></label><label>لینک تصویر کاور<input name="cover_url" type="url" placeholder="https://..."></label><label>لینک عکس خواننده<input name="artist_image_url" type="url" placeholder="https://..."></label><label>یا فایل MP3 (تا ۲۰ مگابایت)<input name="audio" type="file" accept=".mp3,audio/mpeg"></label></div><p>یک لینک یا فایل MP3 لازم است. فقط موسیقی‌ای را منتشر کن که مجوز اشتراک‌گذاری آن را داری.</p><button id="submit" type="submit">＋ ثبت آهنگ</button></form><p class="status" id="status" role="status"></p></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const $=id=>document.getElementById(id);let db,user;
const u=localStorage.getItem('music_url'),k=localStorage.getItem('music_key');
if(!u||!k){$('authHint').innerHTML='ابتدا در <a href="index.html">صفحه اصلی</a> اتصال Supabase را تنظیم کن.'}else{
try{db=createClient(u,k);const {data,error}=await db.auth.getUser();if(error||!data.user){$('authHint').innerHTML='برای افزودن آهنگ، ابتدا در <a href="index.html">صفحه اصلی</a> وارد شو.'}else{user=data.user;$('authHint').textContent='وارد شده با: '+user.email;$('songForm').classList.remove('hidden')}}catch(e){$('status').textContent=e.message}}
$('songForm').onsubmit=async e=>{e.preventDefault();if(!db||!user)return;const fd=new FormData(e.target),file=fd.get('audio'),link=String(fd.get('url')||'').trim(),cover=String(fd.get('cover_url')||'').trim(),photo=String(fd.get('artist_image_url')||'').trim(),status=$('status');const urlOk=x=>!x||/^https:\/\/[^\s]+$/i.test(x);if(![link,cover,photo].every(urlOk)){status.textContent='لینک‌ها باید با https شروع شوند';return}if(!link&&!file?.size){status.textContent='لینک یا فایل MP3 لازم است';return}if(file?.size&&(file.size>20*1024*1024||!/\.mp3$/i.test(file.name))){status.textContent='فقط فایل MP3 تا ۲۰ مگابایت پذیرفته می‌شود';return}let path=null;$('submit').disabled=true;try{if(file?.size){path=user.id+'/'+crypto.randomUUID()+'.mp3';const {error}=await db.storage.from('hamnava-audio').upload(path,file,{contentType:'audio/mpeg',upsert:false});if(error)throw error}const {error}=await db.from('songs').insert({title:String(fd.get('title')).trim(),artist:String(fd.get('artist')).trim(),url:link||null,shared_by:String(fd.get('shared_by')||'').trim()||null,cover_url:cover||null,artist_image_url:photo||null,audio_path:path});if(error){if(path)await db.storage.from('hamnava-audio').remove([path]);throw error}status.textContent='آهنگ ثبت شد! در حال بازگشت...';location.href='index.html#library'}catch(err){status.textContent='خطا: '+err.message}finally{$('submit').disabled=false}};
</script><script src="languages.js" defer></script></body></html>
